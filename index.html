<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Animal Run</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CjxyZWN0IHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCIgcng9IjE0IiBmaWxsPSIjM2Y4YTNhIi8+CjxnIGZpbGw9IiMzYTJlMmUiPgo8ZWxsaXBzZSBjeD0iMzIiIGN5PSI0MSIgcng9IjE1IiByeT0iMTIiLz4KPGNpcmNsZSBjeD0iMTMiIGN5PSIyNSIgcj0iNy41Ii8+CjxjaXJjbGUgY3g9IjI3IiBjeT0iMTMiIHI9IjcuNSIvPgo8Y2lyY2xlIGN4PSI0MSIgY3k9IjEzIiByPSI3LjUiLz4KPGNpcmNsZSBjeD0iNTMiIGN5PSIyNSIgcj0iNy41Ii8+CjwvZz4KPGcgZmlsbD0iI2ZmZjVlNiI+CjxlbGxpcHNlIGN4PSIzMiIgY3k9IjQxIiByeD0iMTEuNSIgcnk9IjkiLz4KPGNpcmNsZSBjeD0iMTMiIGN5PSIyNSIgcj0iNS4yIi8+CjxjaXJjbGUgY3g9IjI3IiBjeT0iMTMiIHI9IjUuMiIvPgo8Y2lyY2xlIGN4PSI0MSIgY3k9IjEzIiByPSI1LjIiLz4KPGNpcmNsZSBjeD0iNTMiIGN5PSIyNSIgcj0iNS4yIi8+CjwvZz4KPC9zdmc+Cg==">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    width: 100%;
    height: 100%;
    background: #020f06;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #gameContainer {
    position: relative;
    width: 400px;
    height: 800px;
    overflow: hidden;
    background: linear-gradient(135deg, #0b2b12 0%, #1f5c34 100%);
    border: 3px solid #22c55e;
    box-shadow: 0 0 30px rgba(34, 197, 94, 0.6);
    transform-origin: center center;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    touch-action: none;
  }
  #ui {
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    z-index: 10;
  }
  .ui-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    background: rgba(0, 0, 0, 0.6);
    padding: 8px 12px;
    border-radius: 5px;
  }
  #score {
    color: #ffffff;
    font-size: 24px;
  }
  #coins {
    color: #ffffff;
  }
  #topButtons {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 20;
    display: flex;
    gap: 8px;
  }
  #pauseBtn, #shopBtn {
    background: #22c55e;
    color: #fff;
    border: none;
    padding: 8px 11px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    box-shadow: 0 0 12px rgba(34, 197, 94, 0.7);
    white-space: nowrap;
  }
  #pauseBtn:hover, #shopBtn:hover {
    background: #4ade80;
  }
  #shop {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.95);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 150;
    padding: 20px;
    overflow-y: auto;
  }
  #shop.show { display: flex; }
  #shop h2 {
    color: #39e67a;
    font-size: 32px;
    margin-bottom: 20px;
    text-shadow: 0 0 12px rgba(57, 230, 122, 0.7);
  }
  #shop p {
    color: #ffffff;
    font-size: 18px;
    margin-bottom: 20px;
  }
  .skins-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-bottom: 20px;
    width: 100%;
    max-height: 500px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #22c55e rgba(255, 255, 255, 0.08);
  }
  .skins-grid::-webkit-scrollbar {
    width: 9px;
  }
  .skins-grid::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 5px;
  }
  .skins-grid::-webkit-scrollbar-thumb {
    background: #22c55e;
    border-radius: 5px;
    box-shadow: 0 0 6px rgba(34, 197, 94, 0.7);
  }
  .skins-grid::-webkit-scrollbar-thumb:hover {
    background: #4ade80;
  }
  .skin-item {
    background: rgba(100, 100, 100, 0.3);
    border: 2px solid #666;
    padding: 15px;
    text-align: center;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .skin-item:hover {
    border-color: #22c55e;
    box-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
    transform: scale(1.05);
  }
  .skin-item.owned {
    border-color: #00ff00;
  }
  .skin-item.selected {
    border-color: #39e67a;
    background: rgba(57, 230, 122, 0.2);
  }
  .skin-thumb {
    display: block;
    margin: 0 auto 8px;
    image-rendering: pixelated;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 4px;
  }
  .skin-name {
    color: #fff;
    font-weight: bold;
    margin-bottom: 5px;
  }
  .skin-action-btn {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 9px 8px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
    background: #22c55e;
    color: #fff;
  }
  .skin-action-btn:hover {
    background: #4ade80;
  }
  .skin-action-btn:disabled {
    background: #555;
    cursor: not-allowed;
    opacity: 0.6;
  }
  .skin-action-btn.worn {
    background: #00aa44;
    cursor: default;
  }
  #closeShop {
    background: #ff0000;
    color: #fff;
    border: none;
    padding: 10px 30px;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 15px;
  }
  #gameOver {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(90, 94, 104, 0.85);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 100;
  }
  #gameOver.show { display: flex; }
  #gameOver h1 {
    color: #39e67a;
    font-size: 56px;
    text-shadow: 2px 2px 16px rgba(51, 204, 255, 0.5);
  }
  #gameOver p {
    color: #7be495;
    font-size: 20px;
    font-weight: bold;
  }
  #gameOver button {
    padding: 12px 40px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    background: #22c55e;
    color: #fff;
    border: none;
    border-radius: 8px;
    box-shadow: 0 0 12px rgba(34, 197, 94, 0.7);
  }
  #gameOver button:hover {
    background: #4ade80;
  }
  #gameOver button.secondary {
    background: transparent;
    border: 2px solid #39e67a;
    color: #39e67a;
    box-shadow: none;
  }
  #gameOver button.secondary:hover {
    background: rgba(57, 230, 122, 0.25);
  }
  #pauseMenu {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.88);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 80;
  }
  #pauseMenu.show { display: flex; }
  #pauseMenu h2 {
    color: #39e67a;
    font-size: 40px;
    margin-bottom: 5px;
    text-shadow: 0 0 12px rgba(57, 230, 122, 0.7);
  }
  #pauseMenu p {
    color: #ffffff;
    font-size: 18px;
  }
  #pauseMenu button {
    padding: 12px 40px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: #22c55e;
    color: #fff;
    border: none;
    border-radius: 8px;
    box-shadow: 0 0 12px rgba(34, 197, 94, 0.7);
    min-width: 180px;
  }
  #pauseMenu button:hover {
    background: #4ade80;
  }
  #quitBtn {
    background: #ffffff !important;
    color: #0a7a34 !important;
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.5) !important;
  }
  #quitBtn:hover {
    background: #dff5e6 !important;
  }

  /* ---- Mobile-only enhancements below. Scoped to touch/coarse-pointer devices
     so mouse+keyboard (PC) users see zero change. ---- */
  #ui {
    padding-top: env(safe-area-inset-top, 0px);
    padding-left: env(safe-area-inset-left, 0px);
  }
  #topButtons {
    top: calc(20px + env(safe-area-inset-top, 0px));
    right: calc(20px + env(safe-area-inset-right, 0px));
  }
  @media (pointer: coarse) {
    #pauseBtn, #shopBtn {
      padding: 12px 14px;
      font-size: 13px;
      touch-action: manipulation;
    }
    #closeShop,
    #gameOver button, #pauseMenu button {
      padding: 16px 40px;
      font-size: 18px;
      touch-action: manipulation;
    }
    .skin-item, .skin-action-btn {
      touch-action: manipulation;
    }
  }
  #rotateHint {
    display: none;
    position: fixed;
    inset: 0;
    background: #020f06;
    color: #fff;
    z-index: 999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 18px;
    text-align: center;
    padding: 20px;
  }
  @media (hover: none) and (pointer: coarse) and (orientation: landscape) {
    #rotateHint { display: flex; }
  }
</style>
</head>
<body>
<div id="rotateHint">
  <div style="font-size: 40px;">📱</div>
  <div>Please rotate your device<br>back to portrait mode</div>
</div>
<div id="gameContainer">
  <canvas id="game" width="400" height="800"></canvas>
  <div id="ui">
    <div class="ui-row">
      <div>Coins: <span id="coins">0</span></div>
    </div>
    <div class="ui-row">
      <div>Score: <span id="score">0</span></div>
      <div>High: <span id="highScore">0</span></div>
    </div>
  </div>
  <div id="topButtons">
    <button id="pauseBtn" onclick="togglePause()">PAUSE</button>
    <button id="shopBtn" onclick="toggleShop()">CLOSET</button>
  </div>
  <div id="shop">
    <h2>CLOSET</h2>
    <p>💰 <span id="shopCoins">0</span></p>
    <div class="skins-grid" id="skinsGrid"></div>
    <button id="closeShop" onclick="toggleShop()">CLOSE</button>
  </div>
  <div id="pauseMenu">
    <h2>PAUSED</h2>
    <p>Score: <span id="pauseScore">0</span></p>
    <p>Coins: <span id="pauseCoins">0</span></p>
    <p>High Score: <span id="pauseHigh">0</span></p>
    <button onclick="togglePause()">RESUME</button>
    <button onclick="toggleShop()">CLOSET</button>
    <button id="quitBtn" onclick="quitGame()">QUIT</button>
  </div>
  <div id="gameOver">
    <h1>GAME OVER</h1>
    <p>Score: <span id="finalScore">0</span></p>
    <p>High Score: <span id="gameOverHigh">0</span></p>
    <p>Coins: <span id="earnedCoins">0</span></p>
    <p>Total Coins: <span id="totalCoins">0</span></p>
    <button onclick="location.reload()">PLAY AGAIN</button>
    <button class="secondary" onclick="toggleShop()">CLOSET</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 400;
const H = 800;

// MOBILE: scale the fixed 400x800 game down to fit small viewports.
// Capped at 1 so on any screen already >= 400x800 (every desktop) this is a no-op -
// the PC layout renders at its original native size exactly as before.
function fitGameToScreen() {
  const scale = Math.min(window.innerWidth / 400, window.innerHeight / 800, 1);
  document.getElementById('gameContainer').style.transform = `scale(${scale})`;
}
fitGameToScreen();
window.addEventListener('resize', fitGameToScreen);
window.addEventListener('orientationchange', fitGameToScreen);

// MOBILE: stop the browser from scrolling/bouncing the page while swiping to play.
// Skips preventDefault inside the Closet list so it still scrolls normally.
document.getElementById('gameContainer').addEventListener('touchmove', e => {
  if (e.target.closest('.skins-grid')) return;
  e.preventDefault();
}, { passive: false });

// MOBILE: auto-pause when the app is backgrounded (switching apps, locking screen).
// Gated to touch/coarse-pointer devices so desktop tab-switching behavior is unchanged.
if (window.matchMedia('(pointer: coarse)').matches) {
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && gameState === 'playing') togglePause();
  });
}

// CHARACTERS - drawn entirely with canvas shapes (no external image files, so nothing can fail to load)
const skins = [
  { name: 'Rabbit', colorName: 'White', color: '#ffffff', price: 0, owned: true, type: 'rabbit' },
  { name: 'Rabbit', colorName: 'Tan', color: '#e0a878', price: 400, type: 'rabbit' },
  { name: 'Goat', colorName: 'White', color: '#f5f5f0', price: 600, type: 'goat' },
  { name: 'Goat', colorName: 'Lavender', color: '#c9c3e8', price: 800, type: 'goat' },
  { name: 'Cat', colorName: 'Slate', color: '#8890b0', price: 1000, type: 'cat' },
  { name: 'Cat', colorName: 'Peach', color: '#f5c98a', price: 1200, type: 'cat' },
  { name: 'Pig', colorName: 'Pink', color: '#f7b8c9', price: 1500, type: 'pig' },
  { name: 'Pig', colorName: 'Tan', color: '#e0a878', price: 1800, type: 'pig' },
  { name: 'Dog', colorName: 'Grey', color: '#b8b8c0', price: 2200, type: 'dog' },
  { name: 'Dog', colorName: 'Slate', color: '#9aa0c8', price: 3000, type: 'dog' }
];

// GAME STATE
let gameState = 'playing';
let score = 0;
let collectedCoins = 0;
let totalCoins = parseInt(localStorage.getItem('totalCoins')) || 0;
let highScore = parseInt(localStorage.getItem('highScore')) || 0;
let currentSkinIndex = 0;
let multiplier = 1;
let distance = 0;
let frame = 0;
let gameSpeed = 9;
let maxGameSpeed = 22;

// PLAYER
const player = {
  lane: 1,
  x: 0,
  y: H - 150,
  w: 30,
  h: 50,
  jumping: false,
  jumping_velocity: 0,
  sliding: false,
  sliding_timer: 0
};

const lanes = [85, 200, 315];

// WORLD
let obstacles = [];
let coins = [];
let trees = [];
let dustParticles = [];
let sideTilt = 0;

// Balanced lane picker - keeps a short history so no lane goes noticeably empty
let recentLanes = [];
function pickBalancedLane() {
  const counts = [0, 0, 0];
  for (const l of recentLanes) counts[l]++;
  const maxCount = Math.max(counts[0], counts[1], counts[2]);
  const weights = counts.map(c => (maxCount - c) + 1);
  const total = weights[0] + weights[1] + weights[2];
  let r = Math.random() * total;
  let lane = 0;
  for (let i = 0; i < 3; i++) {
    if (r < weights[i]) { lane = i; break; }
    r -= weights[i];
  }
  recentLanes.push(lane);
  if (recentLanes.length > 6) recentLanes.shift();
  return lane;
}

// INPUT
let touchStartX = 0;
let touchStartY = 0;

document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});

document.addEventListener('touchend', e => {
  handleSwipe();
});

document.addEventListener('mousedown', e => {
  touchStartX = e.clientX;
  touchStartY = e.clientY;
});

document.addEventListener('mouseup', e => {
  handleSwipe();
});

window.addEventListener('keydown', e => {
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
    togglePause();
    return;
  }
  if (gameState !== 'playing') return;
  if (e.key === 'ArrowLeft') moveLeft();
  if (e.key === 'ArrowRight') moveRight();
  if (e.key === 'ArrowUp') jump();
  if (e.key === 'ArrowDown') slide();
});

function handleSwipe() {
  if (gameState !== 'playing') return;
  const touch = event.changedTouches ? event.changedTouches[0] : event;
  const deltaX = touch.clientX - touchStartX;
  const deltaY = touch.clientY - touchStartY;

  if (Math.abs(deltaX) > Math.abs(deltaY)) {
    if (deltaX > 50) moveRight();
    else if (deltaX < -50) moveLeft();
  } else {
    if (deltaY < -50) jump();
    else if (deltaY > 50) slide();
  }
}

function moveLeft() {
  if (player.lane > 0 && !player.sliding && !player.jumping) {
    player.lane--;
    sideTilt = -1;
    spawnDust(player.x, player.y + player.h, 6);
    checkCollision();
  }
}

function moveRight() {
  if (player.lane < 2 && !player.sliding && !player.jumping) {
    player.lane++;
    sideTilt = 1;
    spawnDust(player.x, player.y + player.h, 6);
    checkCollision();
  }
}

function spawnDust(x, y, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.PI + Math.random() * Math.PI; // spread upward-ish, away from ground
    const speed = 1 + Math.random() * 2.5;
    dustParticles.push({
      x: x + (Math.random() - 0.5) * 16,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed * 0.6,
      life: 1,
      size: 3 + Math.random() * 3
    });
  }
}

function jump() {
  if (!player.jumping && !player.sliding) {
    player.jumping = true;
    player.jumping_velocity = -10;
    spawnDust(player.x, player.y + player.h, 9);
  }
}

function slide() {
  if (!player.jumping && !player.sliding) {
    player.sliding = true;
    player.sliding_timer = 30;
  }
}

function checkCollision() {
  for (let obs of obstacles) {
    if (obs.lane === player.lane && player.y < obs.y + obs.h && player.y + player.h > obs.y) {
      endGame();
    }
  }
}

function toggleShop() {
  const shop = document.getElementById('shop');
  shop.classList.toggle('show');
  if (shop.classList.contains('show')) {
    renderShop();
  }
}


function togglePause() {
  if (gameState === 'gameover') return;
  const pauseMenu = document.getElementById('pauseMenu');
  if (gameState === 'playing') {
    gameState = 'paused';
    document.getElementById('pauseScore').textContent = score;
    document.getElementById('pauseCoins').textContent = collectedCoins;
    document.getElementById('pauseHigh').textContent = highScore;
    pauseMenu.classList.add('show');
  } else if (gameState === 'paused') {
    gameState = 'playing';
    pauseMenu.classList.remove('show');
  }
}

function quitGame() {
  document.getElementById('pauseMenu').classList.remove('show');
  endGame();
}

function renderShop() {
  document.getElementById('shopCoins').textContent = totalCoins;
  const grid = document.getElementById('skinsGrid');
  grid.innerHTML = '';

  skins.forEach((skin, idx) => {
    const div = document.createElement('div');
    div.className = 'skin-item';
    if (skin.owned) div.classList.add('owned');
    if (idx === currentSkinIndex) div.classList.add('selected');

    const thumb = document.createElement('canvas');
    thumb.className = 'skin-thumb';
    thumb.width = 70;
    thumb.height = Math.round(70 * (BASE_H / BASE_W));
    const tctx = thumb.getContext('2d');
    drawCharacter(tctx, thumb.width / 2, thumb.height - 3, thumb.width * 0.85, thumb.height * 0.85, skin.type, skin.color, 'front');

    const info = document.createElement('div');
    info.innerHTML = `
      <div class="skin-name">${skin.name} <span style="font-weight: normal; font-size: 12px; opacity: 0.8;">(${skin.colorName})</span></div>
    `;

    const btn = document.createElement('button');
    btn.className = 'skin-action-btn';
    if (!skin.owned) {
      btn.textContent = skin.price === 0 ? 'BUY (FREE)' : '💰 BUY ' + skin.price;
      btn.disabled = totalCoins < skin.price;
      btn.onclick = () => buySkin(idx);
    } else if (idx === currentSkinIndex) {
      btn.textContent = 'WORN ✓';
      btn.disabled = true;
      btn.classList.add('worn');
    } else {
      btn.textContent = 'WEAR';
      btn.onclick = () => wearSkin(idx);
    }

    div.appendChild(thumb);
    div.appendChild(info);
    div.appendChild(btn);
    grid.appendChild(div);
  });
}

function buySkin(idx) {
  const skin = skins[idx];
  if (skin.owned || totalCoins < skin.price) return;
  totalCoins -= skin.price;
  skin.owned = true;
  localStorage.setItem('totalCoins', totalCoins);
  saveSkins();
  renderShop();
}

function wearSkin(idx) {
  if (!skins[idx].owned) return;
  currentSkinIndex = idx;
  saveSkins();
  renderShop();
}

function endGame() {
  gameState = 'gameover';
  totalCoins += collectedCoins;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('highScore', highScore);
  }
  localStorage.setItem('totalCoins', totalCoins);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('gameOverHigh').textContent = highScore;
  document.getElementById('earnedCoins').textContent = collectedCoins;
  document.getElementById('totalCoins').textContent = totalCoins;
  document.getElementById('gameOver').classList.add('show');
}

function update() {
  frame++;
  distance += gameSpeed;
  score += Math.round(gameSpeed / 3); // steady distance-based score

  gameSpeed = Math.min(maxGameSpeed, 9 + Math.floor(distance / 1500));

  if (player.jumping) {
    player.jumping_velocity += 0.6;
    player.y += player.jumping_velocity;
    if (player.y >= H - 150) {
      player.y = H - 150;
      player.jumping = false;
      player.jumping_velocity = 0;
      spawnDust(player.x, player.y + player.h, 12);
    }
  }

  // UPDATE DUST PARTICLES
  for (let i = dustParticles.length - 1; i >= 0; i--) {
    const p = dustParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life -= 0.045;
    if (p.life <= 0) dustParticles.splice(i, 1);
  }

  // DECAY SIDE-STEP TILT
  sideTilt *= 0.8;
  if (Math.abs(sideTilt) < 0.02) sideTilt = 0;

  if (player.sliding) {
    player.sliding_timer--;
    if (player.sliding_timer <= 0) player.sliding = false;
  }

  player.x = lanes[player.lane];

  // SPAWN OBSTACLES - More frequent
  if (frame % Math.max(25, Math.floor(100 - gameSpeed * 4)) === 0) {
    const lane = pickBalancedLane();
    obstacles.push({
      lane: lane,
      y: -50,
      w: 30,
      h: 40,
      type: 'barrier'
    });
  }

  // SPAWN TREES - tall, blocks the whole lane, can't be jumped over
  if (frame % Math.max(250, Math.floor(500 - gameSpeed * 20)) === 0 && Math.random() > 0.5) {
    const lane = pickBalancedLane();
    trees.push({
      lane: lane,
      y: -190,
      w: 80,
      h: 190
    });
  }

  // SPAWN COINS - Much more
  if (frame % 25 === 0) {
    const lane = pickBalancedLane();
    coins.push({
      lane: lane,
      y: -25,
      w: 24,
      h: 24,
      collected: false
    });
  }

  // UPDATE OBSTACLES (bushes - can be jumped over)
  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].y += gameSpeed;

    if (obstacles[i].lane === player.lane && !player.sliding && !player.jumping &&
        player.y < obstacles[i].y + obstacles[i].h && player.y + player.h > obstacles[i].y) {
      endGame();
    }

    if (obstacles[i].y > H) {
      obstacles.splice(i, 1);
      score += 10 * Math.floor(multiplier);
    }
  }

  // UPDATE TREES (cannot be jumped over - must switch lanes)
  for (let i = trees.length - 1; i >= 0; i--) {
    trees[i].y += gameSpeed;

    if (trees[i].lane === player.lane && player.y < trees[i].y + trees[i].h &&
        player.y + player.h > trees[i].y) {
      endGame();
    }

    if (trees[i].y > H) {
      trees.splice(i, 1);
      score += 50 * Math.floor(multiplier);
    }
  }

  // UPDATE COINS
  for (let i = coins.length - 1; i >= 0; i--) {
    coins[i].y += gameSpeed;

    if (!coins[i].collected && coins[i].lane === player.lane &&
        player.y < coins[i].y + coins[i].h && player.y + player.h > coins[i].y) {
      coins[i].collected = true;
      score += 25 * Math.floor(multiplier);
      collectedCoins++;
      multiplier = Math.min(10, multiplier + 0.15);
    }

    if (coins[i].y > H) coins.splice(i, 1);
  }

  if (frame % 60 === 0) {
    multiplier = Math.max(1, multiplier - 0.08);
  }

  updateUI();
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('coins').textContent = collectedCoins;
  document.getElementById('highScore').textContent = highScore;
}

// CHARACTER DRAWING - pure canvas shapes, works in every browser with zero image loading
const OUTLINE = '#3a2e2e';
const BASE_W = 46, BASE_H = 66; // logical drawing box (includes headroom for ears/horns)
const PLAYER_DRAW_W = 42;
const PLAYER_DRAW_H = PLAYER_DRAW_W * (BASE_H / BASE_W);

function shade(hex, factor) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.round(((n >> 16) & 255) * factor));
  const g = Math.min(255, Math.round(((n >> 8) & 255) * factor));
  const b = Math.min(255, Math.round((n & 255) * factor));
  return `rgb(${r},${g},${b})`;
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// flat meadow tuft, like the small dark-green ticks in the reference art
function drawGrassTuft(x, y, size, lean, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(1, size * 0.16);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - size * 0.3, y + size * 0.4);
  ctx.quadraticCurveTo(x - size * 0.35 + lean * 0.3, y - size * 0.1, x - size * 0.15 + lean, y - size * 0.7);
  ctx.moveTo(x, y + size * 0.4);
  ctx.quadraticCurveTo(x + lean * 0.15, y - size * 0.15, x + lean * 0.4, y - size * 0.85);
  ctx.moveTo(x + size * 0.3, y + size * 0.4);
  ctx.quadraticCurveTo(x + size * 0.35 + lean * 0.3, y - size * 0.05, x + size * 0.2 + lean, y - size * 0.6);
  ctx.stroke();
}


function bodyAndHead(c, color) {
  c.fillStyle = OUTLINE;
  roundRect(c, 8, 21, 30, 28, 10);
  c.fill();
  c.fillStyle = color;
  roundRect(c, 9.5, 22.5, 27, 25, 9);
  c.fill();
  c.fillStyle = OUTLINE;
  c.beginPath(); c.arc(23, 14, 14, 0, Math.PI * 2); c.fill();
  c.fillStyle = color;
  c.beginPath(); c.arc(23, 14, 12, 0, Math.PI * 2); c.fill();
}

function drawFace(c) {
  c.fillStyle = '#000';
  c.beginPath(); c.arc(18, 13, 1.6, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(28, 13, 1.6, 0, Math.PI * 2); c.fill();
}

function drawRabbit(c, color, view) {
  c.fillStyle = OUTLINE;
  c.beginPath(); c.ellipse(16, 0, 5.5, 15, -0.15, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(30, 0, 5.5, 15, 0.15, 0, Math.PI * 2); c.fill();
  c.fillStyle = color;
  c.beginPath(); c.ellipse(16, 0, 4, 13.5, -0.15, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(30, 0, 4, 13.5, 0.15, 0, Math.PI * 2); c.fill();
  if (view === 'front') {
    c.fillStyle = '#ffc9de';
    c.beginPath(); c.ellipse(16, 1, 2, 9, -0.15, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(30, 1, 2, 9, 0.15, 0, Math.PI * 2); c.fill();
  }
  bodyAndHead(c, color);
  if (view === 'front') {
    drawFace(c);
    c.fillStyle = '#ff8fa8';
    c.beginPath(); c.arc(23, 17, 1.4, 0, Math.PI * 2); c.fill();
  } else {
    c.fillStyle = shade(color, 0.85);
    c.beginPath(); c.arc(23, 46, 4, 0, Math.PI * 2); c.fill();
  }
}

function drawGoat(c, color, view) {
  const horn = '#d8cdb0';
  c.fillStyle = shade(horn, 0.8);
  c.beginPath(); c.moveTo(14, 2); c.quadraticCurveTo(9, -6, 13, -10); c.quadraticCurveTo(16, -4, 17, 3); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(32, 2); c.quadraticCurveTo(37, -6, 33, -10); c.quadraticCurveTo(30, -4, 29, 3); c.closePath(); c.fill();
  c.fillStyle = horn;
  c.beginPath(); c.moveTo(14.5, 2); c.quadraticCurveTo(10.5, -5, 13.5, -8.5); c.quadraticCurveTo(15.8, -3.5, 16.3, 3); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(31.5, 2); c.quadraticCurveTo(35.5, -5, 32.5, -8.5); c.quadraticCurveTo(30.2, -3.5, 29.7, 3); c.closePath(); c.fill();
  c.fillStyle = OUTLINE;
  c.beginPath(); c.ellipse(9, 13, 5, 8, -0.3, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(37, 13, 5, 8, 0.3, 0, Math.PI * 2); c.fill();
  c.fillStyle = color;
  c.beginPath(); c.ellipse(9, 13, 3.6, 6.5, -0.3, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(37, 13, 3.6, 6.5, 0.3, 0, Math.PI * 2); c.fill();
  bodyAndHead(c, color);
  if (view === 'front') {
    drawFace(c);
    c.fillStyle = shade(color, 0.9);
    roundRect(c, 19, 17, 8, 5, 2); c.fill();
    c.fillStyle = '#000';
    c.beginPath(); c.arc(21, 19.5, 0.8, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(25, 19.5, 0.8, 0, Math.PI * 2); c.fill();
  } else {
    c.fillStyle = shade(color, 0.85);
    roundRect(c, 21, 45, 4, 5, 2); c.fill();
  }
}

function drawCat(c, color, view) {
  c.fillStyle = OUTLINE;
  c.beginPath(); c.moveTo(11, 4); c.lineTo(15, -9); c.lineTo(21, 3); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(35, 4); c.lineTo(31, -9); c.lineTo(25, 3); c.closePath(); c.fill();
  c.fillStyle = color;
  c.beginPath(); c.moveTo(12.5, 3); c.lineTo(15.5, -6); c.lineTo(19.5, 2.5); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(33.5, 3); c.lineTo(30.5, -6); c.lineTo(26.5, 2.5); c.closePath(); c.fill();
  if (view === 'front') {
    c.fillStyle = '#ffc9de';
    c.beginPath(); c.moveTo(14, 1.5); c.lineTo(15.7, -3.5); c.lineTo(18, 1); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(32, 1.5); c.lineTo(30.3, -3.5); c.lineTo(28, 1); c.closePath(); c.fill();
  }
  bodyAndHead(c, color);
  if (view === 'front') {
    drawFace(c);
    c.fillStyle = '#ff8fa8';
    c.beginPath(); c.moveTo(21.5, 17); c.lineTo(24.5, 17); c.lineTo(23, 19); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.7)';
    c.lineWidth = 0.6;
    c.beginPath(); c.moveTo(9, 16); c.lineTo(16, 15); c.moveTo(9, 19); c.lineTo(16, 18); c.stroke();
    c.beginPath(); c.moveTo(37, 16); c.lineTo(30, 15); c.moveTo(37, 19); c.lineTo(30, 18); c.stroke();
  } else {
    c.strokeStyle = shade(color, 0.8);
    c.lineWidth = 4;
    c.lineCap = 'round';
    c.beginPath(); c.moveTo(33, 44); c.quadraticCurveTo(42, 42, 40, 32); c.stroke();
  }
}

function drawPig(c, color, view) {
  c.fillStyle = OUTLINE;
  c.beginPath(); c.ellipse(13, 2, 5, 7, -0.4, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(33, 2, 5, 7, 0.4, 0, Math.PI * 2); c.fill();
  c.fillStyle = color;
  c.beginPath(); c.ellipse(13, 2, 3.6, 5.5, -0.4, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(33, 2, 3.6, 5.5, 0.4, 0, Math.PI * 2); c.fill();
  bodyAndHead(c, color);
  if (view === 'front') {
    drawFace(c);
    c.fillStyle = shade(color, 0.9);
    c.beginPath(); c.ellipse(23, 19, 6, 4.2, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = OUTLINE;
    c.beginPath(); c.arc(21, 19, 0.9, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(25, 19, 0.9, 0, Math.PI * 2); c.fill();
  } else {
    c.strokeStyle = shade(color, 0.85);
    c.lineWidth = 2.4;
    c.lineCap = 'round';
    c.beginPath(); c.moveTo(23, 45); c.quadraticCurveTo(28, 43, 26, 47); c.quadraticCurveTo(24, 49, 23, 46); c.stroke();
  }
}

function drawDog(c, color, view) {
  c.fillStyle = OUTLINE;
  c.beginPath(); c.ellipse(11, 10, 5.5, 11, -0.25, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(35, 10, 5.5, 11, 0.25, 0, Math.PI * 2); c.fill();
  c.fillStyle = color;
  c.beginPath(); c.ellipse(11, 10, 4, 9.5, -0.25, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(35, 10, 4, 9.5, 0.25, 0, Math.PI * 2); c.fill();
  bodyAndHead(c, color);
  if (view === 'front') {
    drawFace(c);
    c.fillStyle = shade(color, 0.92);
    roundRect(c, 18, 16, 10, 8, 4); c.fill();
    c.fillStyle = '#000';
    c.beginPath(); c.arc(23, 19.5, 1.3, 0, Math.PI * 2); c.fill();
  } else {
    c.fillStyle = shade(color, 0.85);
    c.beginPath(); c.ellipse(23, 47, 3.5, 3, 0, 0, Math.PI * 2); c.fill();
  }
}

const ANIMAL_DRAWERS = { rabbit: drawRabbit, goat: drawGoat, cat: drawCat, pig: drawPig, dog: drawDog };

function drawCharacter(c, cx, bottomY, w, h, type, color, view) {
  c.save();
  c.translate(cx - w / 2, bottomY - h);
  c.scale(w / BASE_W, h / BASE_H);
  c.translate(0, 16); // shift down so ear/horn tips (negative y) stay inside the box
  ANIMAL_DRAWERS[type](c, color, view);
  c.restore();
}

function drawSkin(x, y, skinIdx) {
  const skin = skins[skinIdx];
  drawCharacter(ctx, x, y + player.h, PLAYER_DRAW_W, PLAYER_DRAW_H, skin.type, skin.color, 'back');
}

function render() {
  ctx.fillStyle = '#72a83f';
  ctx.fillRect(0, 0, W, H);

  // MEADOW TEXTURE (tufts + flowers), matching 5.png reference.
  // worldY grows without ever wrapping, so each tuft/flower moves smoothly
  // down the screen instead of resetting position every tile cycle.
  const grassSpacing = 44;
  const worldY = frame * gameSpeed;
  const cols = Math.ceil(W / grassSpacing) + 1;
  const rowStart = Math.floor(-worldY / grassSpacing) - 1;
  const rowEnd = Math.ceil((H - worldY) / grassSpacing) + 1;

  for (let row = rowStart; row <= rowEnd; row++) {
    const baseY = row * grassSpacing + worldY;
    for (let col = 0; col < cols; col++) {
      const seed = (((row * 928371 + col * 55317) % 1000 + 1000) % 1000) / 1000;
      const seed2 = (((row * 12841 + col * 7331 + 419) % 1000 + 1000) % 1000) / 1000;
      const seed3 = (((row * 3187 + col * 91721 + 77) % 1000 + 1000) % 1000) / 1000;
      const x = col * grassSpacing + seed * grassSpacing;
      const y = baseY + seed2 * grassSpacing;
      const lean = (seed3 - 0.5) * 8;

      if (seed3 < 0.25) {
        drawGrassTuft(x, y, 12 + seed2 * 8, lean, 'rgba(94,150,55,0.75)');
      }
    }
  }

  // COINS
  for (let c of coins) {
    if (!c.collected) {
      const cx = lanes[c.lane], cy = c.y + 12;
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(cx, cy, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#e0a800';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.beginPath();
      ctx.arc(cx - 3.5, cy - 3.5, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // OBSTACLES - low bushes on the ground, small enough to jump over
  for (let obs of obstacles) {
    const cx = lanes[obs.lane], cy = obs.y + obs.h / 2;
    ctx.save();
    ctx.translate(cx, cy);
    const bw = obs.w, bh = obs.h;
    const r = bw * 0.62;
    const base = bh * 0.42;

    ctx.fillStyle = OUTLINE;
    ctx.beginPath(); ctx.arc(0, base, r + 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-r * 0.7, base + r * 0.2, r * 0.82, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.7, base + r * 0.2, r * 0.82, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, base - r * 0.75, r * 0.72, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#3f8f34';
    ctx.beginPath(); ctx.arc(0, base, r, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-r * 0.7, base + r * 0.2, r * 0.7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.7, base + r * 0.2, r * 0.7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#57b449';
    ctx.beginPath(); ctx.arc(0, base - r * 0.75, r * 0.6, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.arc(-r * 0.35, base - r * 0.9, r * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // TREES - tall, blocks the whole lane, cannot be jumped over
  // Drawn in the same flat-color, thick-outline cartoon style as the animals.
  for (let tree of trees) {
    const tx = lanes[tree.lane], ty = tree.y;
    const trunkW = tree.w * 0.24, trunkH = tree.h * 0.34;
    const trunkX = tx - trunkW / 2, trunkY = ty + tree.h - trunkH;

    ctx.fillStyle = OUTLINE;
    roundRect(ctx, trunkX - 2.5, trunkY - 2.5, trunkW + 5, trunkH + 5, 5);
    ctx.fill();
    ctx.fillStyle = '#8b5a2b';
    roundRect(ctx, trunkX, trunkY, trunkW, trunkH, 4);
    ctx.fill();
    ctx.strokeStyle = shade('#8b5a2b', 0.75);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(trunkX + trunkW * 0.35, trunkY + 4); ctx.lineTo(trunkX + trunkW * 0.35, trunkY + trunkH - 4); ctx.stroke();

    const r = tree.w * 0.42;
    const base = trunkY + 8;
    const lobes = [
      { x: 0, y: -0.9, s: 1 },
      { x: -0.62, y: -0.5, s: 0.8 },
      { x: 0.62, y: -0.5, s: 0.8 },
      { x: 0, y: -1.7, s: 0.66 }
    ];

    // outline pass (slightly larger, drawn first so it reads as a border)
    ctx.fillStyle = OUTLINE;
    for (const l of lobes) {
      ctx.beginPath();
      ctx.arc(tx + l.x * r, base + l.y * r, r * l.s + 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // flat foliage fill
    ctx.fillStyle = '#3f8f34';
    for (const l of lobes) {
      ctx.beginPath();
      ctx.arc(tx + l.x * r, base + l.y * r, r * l.s, 0, Math.PI * 2);
      ctx.fill();
    }

    // lighter top highlight lobe, matching the animals' soft shading
    ctx.fillStyle = '#57b449';
    ctx.beginPath();
    ctx.arc(tx - r * 0.18, base - r * 1.55, r * 0.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath();
    ctx.arc(tx - r * 0.35, base - r * 1.15, r * 0.22, 0, Math.PI * 2);
    ctx.fill();
  }

  // JUMP SHADOW - shrinks and fades the higher the player gets off the ground
  const groundY = H - 150;
  const jumpHeight = Math.max(0, groundY - player.y);
  const shadowScale = Math.max(0.35, 1 - jumpHeight / 110);
  ctx.fillStyle = `rgba(0,0,0,${0.28 * shadowScale})`;
  ctx.beginPath();
  ctx.ellipse(player.x, groundY + player.h + 4, 16 * shadowScale, 6 * shadowScale, 0, 0, Math.PI * 2);
  ctx.fill();

  // DUST PARTICLES - burst on takeoff and landing
  for (const p of dustParticles) {
    ctx.fillStyle = `rgba(224,204,164,${p.life * 0.6})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }

  // PLAYER - With skins
  ctx.save();

  if (player.sliding) {
    ctx.globalAlpha = 0.8;
  }

  if (player.jumping) {
    const stretch = Math.min(1.15, 1 + jumpHeight / 400);
    ctx.translate(player.x, player.y + player.h);
    ctx.scale(1 / stretch, stretch);
    ctx.translate(-player.x, -(player.y + player.h));
  }

  if (sideTilt !== 0) {
    ctx.translate(player.x, player.y + player.h * 0.5);
    ctx.rotate(sideTilt * 0.25);
    ctx.translate(-player.x, -(player.y + player.h * 0.5));
  }

  drawSkin(player.x, player.y, currentSkinIndex);

  ctx.restore();
}

function gameLoop() {
  if (gameState === 'playing') {
    update();
  }
  render();
  requestAnimationFrame(gameLoop);
}

// Load saved skins
window.addEventListener('load', () => {
  const saved = localStorage.getItem('ownedSkins');
  if (saved) {
    const owned = JSON.parse(saved);
    owned.forEach(idx => {
      if (idx > 0) skins[idx].owned = true;
    });
  }
  const savedSkin = localStorage.getItem('currentSkin');
  if (savedSkin) currentSkinIndex = parseInt(savedSkin);
});

// Save skins when purchased
function saveSkins() {
  const owned = skins.map((s, idx) => s.owned ? idx : -1).filter(idx => idx >= 0);
  localStorage.setItem('ownedSkins', JSON.stringify(owned));
  localStorage.setItem('currentSkin', currentSkinIndex);
}

gameLoop();
</script>
